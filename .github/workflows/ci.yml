name: Validation
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: redakesport
          POSTGRES_USER: redak
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redak -d redakesport"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://redak:test_password@127.0.0.1:5432/redakesport_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Docker configurations
        env:
          APP_DOMAIN: esport.example.test
          ACME_EMAIL: ops@example.test
          POSTGRES_PASSWORD: ci_only_0123456789_abcdefghijklmnopqrst
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f compose.production.yml config --quiet
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results
